confirm-before-quit = true
scrollback-history-limit = 0
enable-scroll-bar = false
line-height = 1.12
adaptive-theme = { dark = "nova-dark", light = "nova-light" }

[bell]
audio = true

[colors]
cursor = "#00e6ff"

[effects]
trail-cursor = true

[window]
width = 960
height = 620
decorations = "disabled"
opacity = 0.70
blur = true
opacity-cells = true

[panel]
margin = [0.0]
padding = [0.0]
border-width = 0.0

[fonts]
size = 16.0
# Slot families, not `family`, so a user font slot still wins.
regular = { family = "JetBrains Mono" }
bold = { family = "JetBrains Mono" }
italic = { family = "JetBrains Mono" }
bold-italic = { family = "JetBrains Mono" }
additional-dirs = []
symbol-map = [
  { start = "E000", end = "F900", font-family = "JetBrainsMono NF" },
  { start = "F0000", end = "F3000", font-family = "JetBrainsMono NF" },
  { start = "1F5B0", end = "1F5C0", font-family = "Noto Sans Symbols 2" },
  { start = "2600", end = "276F", font-family = "Noto Color Emoji" },
  { start = "1F000", end = "1F5B0", font-family = "Noto Color Emoji" },
  { start = "1F5C0", end = "1FB00", font-family = "Noto Color Emoji" },
]

[navigation]
mode = "plain"
