# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: nova-rio

partial:
  by: goos

report_sizes: true

env:
  - CARGO_TERM_COLOR=always
  - RUST_BACKTRACE=full

before:
  hooks:
    - if: '{{ ne .Runtime.Goos "windows" }}'
      cmd: tic -xe rio -o misc misc/rio.terminfo
      output: true
    - if: '{{ eq .Runtime.Goos "windows" }}'
      cmd: dotnet tool install --global wix --version 5.0.2
      output: true
    - if: '{{ eq .Runtime.Goos "windows" }}'
      cmd: wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      output: true

builds:
  - id: windows-x86_64
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --features=wgpu]
    targets: [x86_64-pc-windows-msvc]

  - id: windows-arm64
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --features=wgpu]
    targets: [aarch64-pc-windows-msvc]

  - id: macos
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --features=wgpu]
    env:
      - MACOSX_DEPLOYMENT_TARGET={{ if eq .Arch "amd64" }}10.15{{ else }}11.0{{ end }}
    targets: [x86_64-apple-darwin, aarch64-apple-darwin]

  - id: linux-arm64-wayland
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=wayland, --features=wgpu]
    targets: [aarch64-unknown-linux-gnu]

  - id: linux-arm64-x11
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=x11, --features=wgpu]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [aarch64-unknown-linux-gnu]

  - id: linux-x64-wayland
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=wayland, --features=wgpu]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [x86_64-unknown-linux-gnu]

  - id: linux-x64-x11
    binary: nrio
    builder: rust
    command: build
    flags: [--release, -p=rioterm, --no-default-features, --features=x11, --features=wgpu]
    env:
      - CARGO_PROFILE_RELEASE_OPT_LEVEL=s
    targets: [x86_64-unknown-linux-gnu]

release:
  make_latest: "{{ if .IsNightly }}false{{ else }}true{{ end }}"
  mode: append
  prerelease: auto
  use_existing_draft: false
  replace_existing_draft: false
  replace_existing_artifacts: true
  include_meta: false
  # No header or footer here: changelog.disable below skips the pipe that
  # renders them, so they would never reach the release. The release workflow
  # sets the body with `gh release edit` instead.

nightly:
  version_template: "{{ incminor .Version }}-nightly"
  tag_name: nightly
  publish_release: true
  keep_single_release: true

changelog:
  disable: true

checksum:
  name_template: checksums.txt

archives:
  - id: win-x64
    formats: [binary]
    ids: [windows-x86_64]
    name_template: "{{ .ProjectName }}-portable-x86_64"
  - id: win-arm64
    formats: [binary]
    ids: [windows-arm64]
    name_template: "{{ .ProjectName }}-portable-aarch64"

universal_binaries:
  - id: rio
    name_template: nrio
    ids: [macos]
    replace: true

dmg:
  - id: rio
    ids: [rio]
    name: "{{ .ProjectName }}"
    use: appbundle

notarize:
  macos_native:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        identity: "Developer ID Application: Hugo Amorim"
        keychain: "{{ .Env.KEYCHAIN_PATH }}"
        options: [runtime]
      notarize:
        wait: true
        profile_name: "{{ .Env.MACOS_NOTARY_KEYCHAIN_PROFILE }}"

app_bundles:
  - id: rio
    name: NovaRio
    ids: [rio]
    icon: ./misc/osx/NovaRio.app/Contents/Resources/icon.icns
    bundle: com.yazelix.nova-rio
    extra_files:
      - src: ./misc/72/rio
        dst: Contents/Resources/72/rio
      # releases made before goreleaser integration included the classic icon
      - src: ./misc/osx/NovaRio.app/Contents/Resources/icon-classic.icns
        dst: Contents/Resources/icon-classic.icns
    templated_extra_files:
      - src: ./misc/osx/NovaRio.app/Contents/Info.plist
        dst: Contents/Info.plist

nfpms:
  - formats: [deb, rpm]
    id: deb-arm64-wayland
    ids: [linux-arm64-wayland]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_wayland"
    package_name: nova-rio
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/com.yazelix.nova-rio.desktop
            dst: /usr/share/applications/com.yazelix.nova-rio.desktop
          - src: ./misc/r/rio
            dst: /usr/share/terminfo/r/rio
          - src: ./misc/logo.svg
            dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    contents:
      - src: ./misc/com.yazelix.nova-rio.desktop
        dst: /usr/share/applications/com.yazelix.nova-rio.desktop
      - src: ./misc/logo.svg
        dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    section: admin
    priority: optional
  - formats: [deb, rpm]
    id: deb-arm64-x11
    ids: [linux-arm64-x11]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_x11"
    package_name: nova-rio
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/com.yazelix.nova-rio.desktop
            dst: /usr/share/applications/com.yazelix.nova-rio.desktop
          - src: ./misc/r/rio
            dst: /usr/share/terminfo/r/rio
          - src: ./misc/logo.svg
            dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    contents:
      - src: ./misc/com.yazelix.nova-rio.desktop
        dst: /usr/share/applications/com.yazelix.nova-rio.desktop
      - src: ./misc/logo.svg
        dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    section: admin
    priority: optional
  - formats: [deb, rpm]
    id: deb-x64-wayland
    ids: [linux-x64-wayland]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_wayland"
    package_name: nova-rio
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/com.yazelix.nova-rio.desktop
            dst: /usr/share/applications/com.yazelix.nova-rio.desktop
          - src: ./misc/r/rio
            dst: /usr/share/terminfo/r/rio
          - src: ./misc/logo.svg
            dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    contents:
      - src: ./misc/com.yazelix.nova-rio.desktop
        dst: /usr/share/applications/com.yazelix.nova-rio.desktop
      - src: ./misc/logo.svg
        dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    section: admin
    priority: optional
  - formats: [deb, rpm]
    id: deb-x64-x11
    ids: [linux-x64-x11]
    file_name_template: "{{- trimsuffix .ConventionalFileName .ConventionalExtension -}}_x11"
    package_name: nova-rio
    dependencies: [libc6 (>= 2.35), libstdc++6 (>= 11)]
    overrides:
      rpm:
        dependencies: [glibc, libstdc++]
        contents:
          - src: ./misc/com.yazelix.nova-rio.desktop
            dst: /usr/share/applications/com.yazelix.nova-rio.desktop
          - src: ./misc/r/rio
            dst: /usr/share/terminfo/r/rio
          - src: ./misc/logo.svg
            dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    contents:
      - src: ./misc/com.yazelix.nova-rio.desktop
        dst: /usr/share/applications/com.yazelix.nova-rio.desktop
      - src: ./misc/logo.svg
        dst: /usr/share/icons/hicolor/scalable/apps/nrio.svg
    section: admin
    priority: optional

msi:
  - id: win-x64
    name: "{{ .ProjectName }}-installer-x86_64"
    wxs: ./misc/windows/rio.wxs
    ids: [windows-x86_64]
    extensions: [WixToolset.UI.wixext, WixToolset.Util.wixext]
    extra_files: [./misc/windows/rio.ico, ./misc/windows/License.rtf]
  - id: win-arm64
    name: "{{ .ProjectName }}-installer-aarch64"
    wxs: ./misc/windows/rio.wxs
    ids: [windows-arm64]
    extensions: [WixToolset.UI.wixext, WixToolset.Util.wixext]
    extra_files: [./misc/windows/rio.ico, ./misc/windows/License.rtf]

metadata:
  maintainers: [Raphael Amorim <rapha850 at gmail dot com>]
  license: MIT
  description: A hardware-accelerated GPU terminal emulator focusing to run in desktops and browsers.
  homepage: https://rioterm.com
